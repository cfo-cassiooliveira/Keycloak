# Tema de login do Workspace em Bootstrap 5. Herda só os templates do "base" (sem PatternFly) e
# mapeia as classes kc* para classes do Bootstrap, para que todas as telas do fluxo (login, troca de senha,
# OTP, erro, info...) fiquem no mesmo padrão visual.
parent=base
# Necessário para url.resourcesCommonPath (scripts de WebAuthn/passkeys do base); nenhum CSS dele é carregado.
import=common/keycloak
# O Bootstrap vem do WebJar fixado no pom.xml e é extraído para vendor/ durante o build.
styles=vendor/bootstrap/bootstrap.min.css css/workspace.css
# Versão dos recursos (preenchida pelo Maven). O Keycloak serve recursos com cache de 30 dias num caminho que só muda
# com a versão do Keycloak; os links levam ?v= para o navegador buscar a versão nova a cada release do tema.
workspaceAssetsVersion=${project.version}
locales=pt-BR,en
meta=viewport==width=device-width,initial-scale=1

kcBodyClass=ws-body

# Formulários
kcFormClass=
kcFormGroupClass=mb-3
kcLabelWrapperClass=
kcLabelClass=form-label
kcInputWrapperClass=
kcInputClass=form-control form-control-lg
kcTextareaClass=form-control
kcInputGroup=input-group input-group-lg
kcInputErrorMessageClass=invalid-feedback d-block
kcInputHelperTextBeforeClass=form-text mt-0 mb-1
kcInputHelperTextAfterClass=form-text
kcContentWrapperClass=row
kcFormSettingClass=d-flex justify-content-between align-items-center
kcFormOptionsClass=
kcFormOptionsWrapperClass=small
kcFormButtonsClass=d-grid gap-2 mt-4
kcFormButtonsWrapperClass=
kcMarginTopClass=mt-3
kcSignUpClass=mt-4 pt-3 border-top text-center
kcInfoAreaWrapperClass=small

# Checkbox e radio
kcCheckInputClass=form-check-input
kcCheckboxInputClass=form-check-input
kcInputClassCheckbox=form-check
kcInputClassCheckboxInput=form-check-input
kcInputClassCheckboxLabel=form-check-label
kcInputClassRadio=form-check
kcInputClassRadioInput=form-check-input
kcInputClassRadioLabel=form-check-label
kcInputClassRadioCheckboxLabelDisabled=text-body-secondary

# Botões
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonSecondaryClass=btn-outline-secondary
kcButtonDefaultClass=btn-outline-secondary
kcButtonBlockClass=w-100
kcButtonLargeClass=btn-lg
kcFormPasswordVisibilityButtonClass=btn btn-outline-secondary ws-password-toggle
kcFormPasswordVisibilityIconShow=ws-icon ws-icon-eye
kcFormPasswordVisibilityIconHide=ws-icon ws-icon-eye-off

# Alertas e ícones (ícones são máscaras SVG do workspace.css, sem fonte de ícones)
kcAlertClass=alert d-flex gap-2 align-items-start
kcAlertTitleClass=
kcFeedbackErrorIcon=ws-icon ws-icon-error
kcFeedbackWarningIcon=ws-icon ws-icon-warning
kcFeedbackSuccessIcon=ws-icon ws-icon-success
kcFeedbackInfoIcon=ws-icon ws-icon-info
kcResetFlowIcon=ws-icon ws-icon-restart
kcWebAuthnDefaultIcon=ws-icon ws-icon-key
kcWebAuthnKeyIcon=ws-icon ws-icon-key

# Escolha de método de autenticação e de dispositivo OTP
kcSelectAuthListClass=list-group
kcSelectAuthListItemClass=list-group-item list-group-item-action d-flex align-items-center gap-3 py-3
kcSelectAuthListItemIconClass=flex-shrink-0
kcSelectAuthListItemIconPropertyClass=ws-icon ws-icon-key
kcSelectAuthListItemBodyClass=flex-grow-1
kcSelectAuthListItemHeadingClass=fw-semibold
kcSelectAuthListItemDescriptionClass=small text-body-secondary
kcSelectAuthListItemFillClass=
kcSelectAuthListItemTitle=
kcSelectAuthListItemArrowClass=flex-shrink-0
kcSelectAuthListItemArrowIconClass=ws-icon ws-icon-chevron
kcLoginOTPListClass=list-group mb-3
kcLoginOTPListInputClass=btn-check
kcLoginOTPListItemHeaderClass=d-flex align-items-center gap-2
kcLoginOTPListItemIconBodyClass=
kcLoginOTPListItemIconClass=ws-icon ws-icon-key
kcLoginOTPListItemTitleClass=fw-semibold

# Provedores de identidade externos
kcFormSocialAccountSectionClass=mt-4
kcFormSocialAccountListClass=list-unstyled d-grid gap-2 mb-0
kcFormSocialAccountListGridClass=
kcFormSocialAccountGridItem=
kcFormSocialAccountListButtonClass=btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2
kcFormSocialAccountListButtonDisabledClass=disabled
kcFormSocialAccountNameClass=
kcCommonLogoIdP=

# Códigos de recuperação
kcRecoveryCodesWarning=alert alert-warning
kcRecoveryCodesList=list-unstyled font-monospace
kcRecoveryCodesActions=d-flex gap-2 mb-3
