# Keycloak do Workspace (ambiente local). Antes da primeira subida: ./scripts/generate-env.sh && ./scripts/identity-network.sh
# Uso: docker compose up -d --build && ./scripts/smoke-test.sh
# Portas só em 127.0.0.1: 8180 (login/OIDC/Admin Console), 9100 (health/metrics) e 8025 (Mailpit).
# 9000/9001 são do Graylog/SonarQube.
name: keycloak

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD ausente. Rode ./scripts/generate-env.sh}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    build: .
    image: workspace-keycloak:0.3.2
    # --import-realm ignora realms que já existem no banco: reiniciar não sobrescreve configuração feita depois.
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD ausente. Rode ./scripts/generate-env.sh}
      # Admin temporário do realm master; troque por um admin permanente com MFA (README).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME ausente. Rode ./scripts/generate-env.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD ausente. Rode ./scripts/generate-env.sh}
      # HTTP só no ambiente local; fora dele o Keycloak fica atrás de proxy TLS (proxy-headers=xforwarded).
      KC_HOSTNAME: http://localhost:8180
      # Containers da rede workspace-identity (BFF do cadastro) chamam http://keycloak:8080: com o backchannel
      # dinâmico, token/JWKS respondem nesse endereço e o issuer continua http://localhost:8180 (o do navegador).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
      # O listener padrão jboss-logging grava username e IP; em "trace" ele nunca aparece no log (LGPD), nem em
      # realms criados no futuro. A auditoria fica com o workspace-audit (provisioner configura o master).
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL: trace
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__ERROR_LEVEL: trace
    # Tempo para a fila de auditoria ser entregue (ou ir para o fallback) no desligamento (ADR-0004).
    stop_grace_period: 30s
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      # Fallback da auditoria (registros que o Graylog não aceitou), persistente entre reinícios (ADR-0004).
      - keycloak-audit-fallback:/opt/keycloak/data/log
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9100:9000"
    networks:
      - default
      - identity
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # A imagem não tem curl: usa /dev/tcp do bash na porta de gerenciamento.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # SMTP de desenvolvimento: guarda os e-mails (reset de senha) sem entregá-los; caixa em http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Provisionamento idempotente do realm master (auditoria, força bruta, client de serviço, sem password grant).
  # Roda a cada "docker compose up"; para reaplicar: docker compose run --rm provisioner
  provisioner:
    image: workspace-keycloak:0.3.2
    entrypoint: ["bash", "/provisioning/provision.sh"]
    environment:
      KC_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME ausente. Rode ./scripts/generate-env.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD ausente. Rode ./scripts/generate-env.sh}
      KC_AUTOMATION_CLIENT_SECRET: ${KC_AUTOMATION_CLIENT_SECRET:?KC_AUTOMATION_CLIENT_SECRET ausente. Rode ./scripts/generate-env.sh}
      KC_CADASTRO_CLIENT_SECRET: ${KC_CADASTRO_CLIENT_SECRET:?KC_CADASTRO_CLIENT_SECRET ausente. Rode ./scripts/generate-env.sh}
    volumes:
      - ./provisioning:/provisioning:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

networks:
  # Rede compartilhada com o cadastro e o legado (spec 001 do cadastro); criada por ./scripts/identity-network.sh.
  identity:
    name: workspace-identity
    external: true

volumes:
  keycloak-db-data:
  keycloak-audit-fallback:
