# CI do Keycloak do Workspace (Art. V; ordem do testing-quality.md).
# Segredos opcionais (Settings > Secrets and variables > Actions), para o Quality Gate:
#   SONAR_TOKEN     token de análise do SonarQube (projeto "keycloak")
#   SONAR_HOST_URL  URL do SonarQube Server alcançável pelos runners
# Sem eles, o job quality-gate é pulado com aviso (o SonarQube local não é alcançável pelos runners: rode
# ./scripts/sonar-analysis.sh antes do PR).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  java:
    name: build + testes Java (unitários e integração)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unitários, integração com Keycloak real (keycloak-test-framework) e JaCoCo >= 80%.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  theme-unit:
    name: testes do JavaScript do tema (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/theme-unit.sh

  static-checks:
    name: ShellCheck + varredura de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck (scripts não têm analisador no SonarQube)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -S warning scripts/*.sh provisioning/*.sh mvnw
      - name: Trivy nas dependências (HIGH/CRITICAL com correção disponível)
        run: >-
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --ignorefile /src/.trivyignore.yaml --exit-code 1 /src

  image:
    name: imagem + smoke test + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [java, theme-unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/generate-env.sh
      - run: docker compose up -d --build --wait keycloak
      - name: Provisionamento do realm master
        run: docker compose run --rm provisioner
      - name: Trivy na imagem (HIGH/CRITICAL com correção; exceções com prazo no .trivyignore.yaml)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" image
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore.yaml
          --exit-code 1 workspace-keycloak:$(sed -n 's#.*image: workspace-keycloak:\(.*\)#\1#p' docker-compose.yml | head -1)
      - run: ./scripts/smoke-test.sh
      - run: ./scripts/e2e.sh
      - name: Logs do Keycloak em caso de falha
        if: failure()
        run: docker compose logs --no-color keycloak provisioner | tail -200

  sonar-config:
    name: SonarQube configurado?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarQube não configurado::Defina SONAR_TOKEN e SONAR_HOST_URL para ativar o Quality Gate."
          fi

  quality-gate:
    name: Quality Gate (SonarQube)
    needs: [sonar-config, java, theme-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.sonar-config.outputs.enabled == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/sonar-analysis.sh
